# Static site for Cloudflare (Workers Static Assets / Pages-compatible).
# Project root is the publish output — no build step.
# Exclude junk via .assetsignore (node_modules, git, etc.).

name = "table-visualization"
compatibility_date = "2024-10-01"

# Required when Cloudflare runs `wrangler deploy` (not `pages deploy`)
[assets]
directory = "."
# Valid: auto-trailing-slash | force-trailing-slash | drop-trailing-slash | none
html_handling = "auto-trailing-slash"
